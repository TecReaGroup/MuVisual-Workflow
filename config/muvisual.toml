[separation]
model = "BS-Roformer-SW.ckpt"

[audio_to_midi]
default_instrument = "piano"
device = "auto"
dtype = "auto"

[audio_to_midi.instruments.piano]
model = "muscriptor"
checkpoint = "medium"
target_instruments = ["acoustic_piano"]

[audio_to_midi.instruments.other]
model = "muscriptor"
checkpoint = "medium"
target_instruments = ["string_ensemble"]

# [audio_to_midi.instruments.guitar]
