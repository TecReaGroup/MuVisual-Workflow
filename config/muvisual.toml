# [audio_to_midi.instruments.drums]
# model = "muscriptor"
# checkpoint = "large"
# target_instruments = ["drums"]

# To use Transkun, set model = "transkun" and checkpoint = "2.0".
# Optional Transkun fields are segment_hop_size and segment_size.

[beat_detection]
enabled = true
model = "final0"
device = "auto"
dbn = true
