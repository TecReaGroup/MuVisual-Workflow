[project]
name = "muvisual-workflow"
version = "0.1.0"
description = "Audio separation and piano transcription workflow for MuVisual"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-separator[gpu]",
    "beat-this>=1.1.0",
    "fastapi",
    "huggingface-hub>=1.27.0",
    "madmom @ git+https://github.com/CPJKU/madmom.git@27f032e8947204902c675e5e341a3faf5dc86dae",
    "modal",
    "mido",
    "moduleconf",
    "muscriptor==0.3.0",
    "mutagen",
    "numpy",
    "partitura",
    "pyyaml",
    "scipy",
    "soxr",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transkun",
]

[project.scripts]
muvisual = "muvisual_workflow.workflow.pipeline:main"
muvisual-fix-midi = "muvisual_workflow.audio_to_midi.normalizer:main"
muvisual-quantize-midi = "muvisual_workflow.audio_to_midi.quantization:main"
muvisual-gate = "muvisual_workflow.audio_to_midi.noise_gate:main"
muvisual-beats = "muvisual_workflow.beat_detection:main"
muvisual-separate = "muvisual_workflow.separation:main"
muvisual-split-midi = "muvisual_workflow.tools.hand_splitter:main"
muvisual-transcribe = "muvisual_workflow.audio_to_midi:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.uv]
constraint-dependencies = ["numba>=0.59.1"]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
